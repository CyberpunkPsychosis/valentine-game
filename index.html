<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Happy Valentine's Day - Lily!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Arial', sans-serif; touch-action: none; background: #000; }
        canvas { display: block; }

        .screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; transition: opacity 0.5s;
        }

        #startScreen {
            background: radial-gradient(ellipse at center, rgba(255,20,147,0.15) 0%, rgba(0,0,0,0.95) 70%);
        }

        .game-title {
            font-size: clamp(28px, 7vw, 56px);
            font-weight: bold; color: #fff;
            text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493, 0 0 80px #ff69b4;
            animation: titleGlow 3s ease-in-out infinite;
            text-align: center; margin-bottom: 10px;
        }

        .game-subtitle {
            font-size: clamp(14px, 3.5vw, 22px);
            color: #ffb6c1; margin-bottom: 30px; text-align: center;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493; filter: brightness(1); }
            50% { text-shadow: 0 0 40px #ff69b4, 0 0 80px #ff1493, 0 0 120px #ff69b4; filter: brightness(1.2); }
        }

        .btn {
            padding: 14px 50px; font-size: clamp(18px, 4vw, 26px);
            background: linear-gradient(135deg, #ff1493, #ff69b4, #ff1493);
            background-size: 200% 200%; animation: btnShine 3s ease infinite;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50px;
            color: white; cursor: pointer; font-weight: bold; letter-spacing: 2px;
            box-shadow: 0 5px 30px rgba(255,20,147,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            transition: all 0.3s; position: relative; overflow: hidden;
        }

        .btn:active { transform: scale(0.95); }

        @keyframes btnShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .instruction {
            font-size: clamp(12px, 3vw, 16px);
            color: rgba(255,182,193,0.7); margin-top: 20px;
        }

        .avatar-preview {
            width: clamp(80px, 20vw, 120px);
            height: clamp(80px, 20vw, 120px);
            border-radius: 50%; border: 3px solid #ff69b4;
            box-shadow: 0 0 30px rgba(255,20,147,0.6);
            margin-bottom: 20px;
            animation: floatAvatar 3s ease-in-out infinite;
            object-fit: cover;
        }

        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #hud {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 15px 20px; z-index: 5;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
        }

        .hud-score {
            font-size: clamp(16px, 4vw, 24px); color: white; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hud-bar-wrap {
            flex: 1; max-width: 200px; height: 8px;
            background: rgba(255,255,255,0.15); border-radius: 10px;
            margin: 0 15px; overflow: hidden;
        }

        .hud-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff1493, #ff69b4, #ffb6c1);
            border-radius: 10px; transition: width 0.3s;
        }

        .hidden { display: none !important; }

        #victoryScreen {
            background: radial-gradient(ellipse at center, rgba(255,20,147,0.2) 0%, rgba(0,0,0,0.92) 70%);
        }

        .victory-text {
            font-size: clamp(36px, 9vw, 72px);
            font-weight: bold; color: #ff69b4;
            text-align: center; line-height: 1.4;
            text-shadow: 0 0 30px #ff1493, 0 0 60px #ff69b4, 0 0 100px #ff1493;
            animation: victoryPulse 2s ease-in-out infinite;
            margin: 20px;
        }

        @keyframes victoryPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .victory-sub {
            font-size: clamp(16px, 4vw, 24px);
            color: #ffb6c1; margin-bottom: 30px;
        }

        #gameOverScreen {
            background: radial-gradient(ellipse at center, rgba(100,0,50,0.2) 0%, rgba(0,0,0,0.92) 70%);
        }

        .gameover-text {
            font-size: clamp(30px, 7vw, 52px);
            font-weight: bold; color: #ff69b4; margin-bottom: 10px;
            text-shadow: 0 0 20px #ff1493;
        }

        .gameover-score {
            font-size: clamp(16px, 4vw, 22px);
            color: #ffb6c1; margin-bottom: 25px;
        }
    </style>
</head>

        <div class="game-title">莉莉的情人节冒险</div>
        <div class="game-subtitle">收集 20 颗爱心，解锁甜蜜惊喜</div>
        <button class="btn" onclick="startGame()">开始冒险</button>
        <div class="instruction">点击屏幕 / 按空格键跳跃</div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <div class="gameover-text">别灰心！</div>
        <div class="gameover-score">已收集 <span id="finalScore">0</span> 颗爱心</div>
        <button class="btn" onclick="startGame()">再来一次</button>
        <div class="instruction">爱需要勇气，加油！</div>
    </div>

    <div id="victoryScreen" class="screen hidden">
        <canvas id="fwCanvas"></canvas>
        <div class="victory-text">我爱你，莉莉！<br>情人节快乐！</div>
        <div class="victory-sub" id="victorySub"></div>
        <button class="btn" onclick="startGame()">再玩一次</button>
    </div>

    <div id="hud" class="hidden">
        <div class="hud-score">❤ <span id="scoreVal">0</span> / 20</div>
        <div class="hud-bar-wrap"><div class="hud-bar" id="progressBar"></div></div>
        <div class="hud-score" id="comboText"></div>
    </div>

<script>
// ===== Canvas Setup =====
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const fwCanvas = document.getElementById('fwCanvas');
const fwCtx = fwCanvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    fwCanvas.width = window.innerWidth;
    fwCanvas.height = window.innerHeight;
    fwCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;';
}
resize();
window.addEventListener('resize', resize);

// ===== Load Player Image =====
const playerImg = new Image();
playerImg.src = document.getElementById('avatarPreview').src;

// ===== Game Constants =====
const GROUND_H = 80;
const TARGET = 20;
const GRAVITY = 0.65;
const JUMP_POWER = -13.5;
const DOUBLE_JUMP_POWER = -11;

// ===== Game State =====
let state = 'start'; // start | playing | gameover | victory
let score, combo, maxCombo, jumpCount, speed, spawnTimer, obstacleTimer;
let player, hearts, obstacles, platforms, particles, bgStars, trailParticles;
let groundOffset = 0;
let time = 0;
let shakeAmount = 0;
let lastTime = 0;
let deltaTime = 0;

// ===== Star Background (persistent) =====
function initStars() {
    bgStars = [];
    for (let i = 0; i < 100; i++) {
        bgStars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.5 + 0.1,
            twinkle: Math.random() * Math.PI * 2
        });
    }
}
initStars();

// ===== Init Game =====
function initGame() {
    score = 0; combo = 0; maxCombo = 0; jumpCount = 0;
    speed = 3.5; spawnTimer = 0; obstacleTimer = 0;
    player = {
        x: canvas.width * 0.15,
        y: canvas.height - GROUND_H - 50,
        w: 50, h: 50,
        vy: 0, jumps: 0, maxJumps: 2,
        grounded: false, onPlatform: false
    };
    hearts = []; obstacles = []; platforms = []; particles = []; trailParticles = [];
    shakeAmount = 0;
}

// ===== Spawn Functions =====
function spawnHeart() {
    const groundY = canvas.height - GROUND_H;
    // variety of heart positions
    const patterns = [
        () => ({ x: canvas.width + 20, y: groundY - 60 - Math.random() * 80, size: 22 + Math.random() * 10 }),
        () => ({ x: canvas.width + 20, y: groundY - 150 - Math.random() * 100, size: 25 + Math.random() * 8 }),
        () => ({ x: canvas.width + 20, y: groundY - 250 - Math.random() * 60, size: 20 + Math.random() * 12 }),
    ];
    const h = patterns[Math.floor(Math.random() * patterns.length)]();
    h.speed = speed * (0.8 + Math.random() * 0.4);
    h.phase = Math.random() * Math.PI * 2;
    h.baseY = h.y;
    h.collected = false;
    h.glow = 0;
    hearts.push(h);
}

function spawnObstacle() {
    const groundY = canvas.height - GROUND_H;
    const type = Math.random();
    if (type < 0.5) {
        // spike
        obstacles.push({
            x: canvas.width + 20, y: groundY,
            w: 25, h: 40 + Math.random() * 20,
            speed: speed, type: 'spike'
        });
    } else if (type < 0.8) {
        // double spike
        obstacles.push({
            x: canvas.width + 20, y: groundY,
            w: 20, h: 45, speed: speed, type: 'spike'
        });
        obstacles.push({
            x: canvas.width + 60, y: groundY,
            w: 20, h: 35, speed: speed, type: 'spike'
        });
    } else {
        // floating obstacle
        obstacles.push({
            x: canvas.width + 20, y: groundY - 120 - Math.random() * 60,
            w: 50, h: 20, speed: speed * 0.9, type: 'float'
        });
    }
}

function spawnPlatform() {
    const groundY = canvas.height - GROUND_H;
    platforms.push({
        x: canvas.width + 20,
        y: groundY - 100 - Math.random() * 120,
        w: 80 + Math.random() * 40, h: 12,
        speed: speed * 0.9
    });
}

// ===== Particle System =====
function emitParticles(x, y, color, count, spread, life) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = Math.random() * spread;
        particles.push({
            x, y,
            vx: Math.cos(angle) * vel,
            vy: Math.sin(angle) * vel - 1,
            life: life || 40 + Math.random() * 20,
            maxLife: life || 40 + Math.random() * 20,
            color,
            size: 2 + Math.random() * 4
        });
    }
}

function emitHeartCollect(x, y) {
    const colors = ['#ff1493', '#ff69b4', '#ffb6c1', '#ff007f', '#fff'];
    for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = 1 + Math.random() * 5;
        particles.push({
            x, y,
            vx: Math.cos(angle) * vel,
            vy: Math.sin(angle) * vel - 2,
            life: 50 + Math.random() * 30,
            maxLife: 50 + Math.random() * 30,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: 3 + Math.random() * 5,
            isHeart: Math.random() > 0.5
        });
    }
    // floating +1 text
    particles.push({
        x, y: y - 10,
        vx: 0, vy: -2,
        life: 60, maxLife: 60,
        color: '#fff',
        size: 0,
        text: combo > 1 ? `+1 x${combo}` : '+1',
        isText: true
    });
}

// ===== Drawing Helpers =====
function drawHeartShape(cx, cy, size, color, glowSize) {
    ctx.save();
    ctx.fillStyle = color || '#ff1493';
    if (glowSize) {
        ctx.shadowColor = color || '#ff1493';
        ctx.shadowBlur = glowSize;
    }
    const s = size * 0.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.3);
    ctx.bezierCurveTo(cx, cy - s * 0.3, cx - s, cy - s * 0.3, cx - s, cy + s * 0.3);
    ctx.bezierCurveTo(cx - s, cy + s * 0.8, cx, cy + s * 1.2, cx, cy + s * 1.5);
    ctx.bezierCurveTo(cx, cy + s * 1.2, cx + s, cy + s * 0.8, cx + s, cy + s * 0.3);
    ctx.bezierCurveTo(cx + s, cy - s * 0.3, cx, cy - s * 0.3, cx, cy + s * 0.3);
    ctx.fill();
    ctx.restore();
}

function drawPlayer() {
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    const r = player.w / 2;

    ctx.save();
    ctx.translate(px, py);

    // glow
    ctx.shadowColor = '#ff69b4';
    ctx.shadowBlur = 25;

    // circular clip for the image
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();

    if (playerImg.complete) {
        const minDim = Math.min(playerImg.width, playerImg.height);
        const sx = (playerImg.width - minDim) / 2;
        const sy = (playerImg.height - minDim) / 2;
        ctx.drawImage(playerImg, sx, sy, minDim, minDim, -r, -r, r * 2, r * 2);
    } else {
        ctx.fillStyle = '#ff1493';
        ctx.fill();
    }
    ctx.restore();

    // border ring
    ctx.save();
    ctx.translate(px, py);
    ctx.strokeStyle = '#ff69b4';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff1493';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(0, 0, r + 2, 0, Math.PI * 2);
    ctx.stroke();

    // spinning ring
    const ringAngle = time * 0.02;
    ctx.strokeStyle = 'rgba(255,105,180,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r + 8, ringAngle, ringAngle + Math.PI * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r + 8, ringAngle + Math.PI, ringAngle + Math.PI * 1.5);
    ctx.stroke();
    ctx.restore();
}

function drawGround() {
    const groundY = canvas.height - GROUND_H;

    // ground gradient
    const grd = ctx.createLinearGradient(0, groundY, 0, canvas.height);
    grd.addColorStop(0, 'rgba(255,20,147,0.15)');
    grd.addColorStop(1, 'rgba(100,0,80,0.3)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, groundY, canvas.width, GROUND_H);

    // ground line
    ctx.strokeStyle = 'rgba(255,105,180,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(canvas.width, groundY);
    ctx.stroke();

    // scrolling dots on ground
    ctx.fillStyle = 'rgba(255,105,180,0.2)';
    groundOffset = (groundOffset + speed * 0.5) % 40;
    for (let x = -groundOffset; x < canvas.width; x += 40) {
        ctx.fillRect(x, groundY + 5, 2, 2);
    }
}

function drawBackground() {
    // gradient sky
    const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grd.addColorStop(0, '#0a0015');
    grd.addColorStop(0.4, '#150030');
    grd.addColorStop(0.7, '#1a0035');
    grd.addColorStop(1, '#200040');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // stars
    bgStars.forEach(s => {
        s.x -= s.speed * (speed * 0.3);
        if (s.x < 0) { s.x = canvas.width; s.y = Math.random() * canvas.height * 0.7; }
        s.twinkle += 0.03;
        const alpha = 0.4 + Math.sin(s.twinkle) * 0.3;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    // aurora effect
    ctx.save();
    ctx.globalAlpha = 0.04;
    for (let i = 0; i < 3; i++) {
        const grd2 = ctx.createLinearGradient(0, 0, canvas.width, 0);
        grd2.addColorStop(0, 'transparent');
        grd2.addColorStop(0.3, '#ff69b4');
        grd2.addColorStop(0.5, '#667eea');
        grd2.addColorStop(0.7, '#ff69b4');
        grd2.addColorStop(1, 'transparent');
        ctx.fillStyle = grd2;
        const yOff = Math.sin(time * 0.005 + i) * 30;
        ctx.fillRect(0, 50 + i * 60 + yOff, canvas.width, 80);
    }
    ctx.restore();
}

// ===== Update =====
function update(ts) {
    deltaTime = Math.min((ts - lastTime) / 16.67, 3); // normalize to ~60fps, cap at 3
    lastTime = ts;
    time++;

    if (state !== 'playing') return;

    // increase difficulty
    speed = 3.5 + (score / TARGET) * 2.5;

    // gravity & movement
    player.vy += GRAVITY * deltaTime;
    player.y += player.vy * deltaTime;
    player.grounded = false;

    const groundY = canvas.height - GROUND_H - player.h;
    if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.grounded = true;
        player.jumps = 0;
    }

    // platform collision
    player.onPlatform = false;
    platforms.forEach(p => {
        if (player.vy >= 0 &&
            player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + 8) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
            player.onPlatform = true;
            player.jumps = 0;
        }
    });

    // trail
    if (Math.abs(player.vy) > 1 || !player.grounded) {
        trailParticles.push({
            x: player.x + player.w / 2,
            y: player.y + player.h,
            life: 20,
            maxLife: 20,
            size: 3 + Math.random() * 3
        });
    }
    trailParticles = trailParticles.filter(t => {
        t.life -= deltaTime;
        t.y += 0.3 * deltaTime;
        return t.life > 0;
    });

    // spawn
    spawnTimer += deltaTime;
    obstacleTimer += deltaTime;

    if (spawnTimer > 70 / (1 + score * 0.02)) {
        spawnHeart();
        spawnTimer = 0;
        if (Math.random() > 0.6) spawnPlatform();
    }
    if (obstacleTimer > 90 / (1 + score * 0.015)) {
        spawnObstacle();
        obstacleTimer = 0;
    }

    // combo timer
    if (combo > 0 && time % 120 === 0) {
        combo = Math.max(0, combo - 1);
    }

    // update hearts
    hearts = hearts.filter(h => {
        h.x -= h.speed * deltaTime;
        h.y = h.baseY + Math.sin(time * 0.04 + h.phase) * 15;
        h.glow = (Math.sin(time * 0.08) + 1) * 8;

        if (!h.collected && checkCollision(
            { x: player.x + 5, y: player.y + 5, w: player.w - 10, h: player.h - 10 },
            { x: h.x - h.size / 2, y: h.y - h.size / 2, w: h.size, h: h.size }
        )) {
            h.collected = true;
            score++;
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            updateHUD();
            emitHeartCollect(h.x, h.y);
            shakeAmount = 5;

            if (score >= TARGET) {
                victory();
                return false;
            }
        }
        return h.x > -50 && !h.collected;
    });

    // update obstacles
    obstacles = obstacles.filter(o => {
        o.x -= o.speed * deltaTime;

        const px = player.x + 8, py = player.y + 8;
        const pw = player.w - 16, ph = player.h - 16;
        const hit = o.type === 'spike'
            ? (px + pw > o.x + 5 && px < o.x + o.w - 5 && py + ph > o.y - o.h && py < o.y)
            : (px + pw > o.x && px < o.x + o.w && py + ph > o.y && py < o.y + o.h);

        if (hit) {
            gameOver();
            emitParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff0000', 30, 6, 40);
            shakeAmount = 12;
        }
        return o.x > -80;
    });

    // update platforms
    platforms = platforms.filter(p => {
        p.x -= p.speed * deltaTime;
        return p.x > -100;
    });

    // update particles
    particles = particles.filter(p => {
        p.x += (p.vx || 0) * deltaTime;
        p.y += (p.vy || 0) * deltaTime;
        if (p.vy !== undefined) p.vy += 0.1 * deltaTime;
        p.life -= deltaTime;
        return p.life > 0;
    });

    // screen shake decay
    if (shakeAmount > 0) shakeAmount *= 0.9;
}

function checkCollision(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function updateHUD() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('progressBar').style.width = (score / TARGET * 100) + '%';
    document.getElementById('comboText').textContent = combo > 1 ? `${combo}x Combo!` : '';
    document.getElementById('comboText').style.color =
        combo >= 5 ? '#ffd700' : combo >= 3 ? '#ff69b4' : '#ffb6c1';
}

// ===== Draw =====
function draw() {
    ctx.save();
    if (shakeAmount > 0.5) {
        ctx.translate(
            (Math.random() - 0.5) * shakeAmount,
            (Math.random() - 0.5) * shakeAmount
        );
    }

    drawBackground();
    drawGround();

    if (state !== 'playing') { ctx.restore(); return; }

    // draw platforms
    platforms.forEach(p => {
        const pgrd = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        pgrd.addColorStop(0, 'rgba(255,105,180,0.6)');
        pgrd.addColorStop(1, 'rgba(255,105,180,0.2)');
        ctx.fillStyle = pgrd;
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 6);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,105,180,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
    });

    // trail
    trailParticles.forEach(t => {
        const alpha = (t.life / t.maxLife) * 0.3;
        ctx.fillStyle = `rgba(255,105,180,${alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size * (t.life / t.maxLife), 0, Math.PI * 2);
        ctx.fill();
    });

    // draw player
    drawPlayer();

    // draw hearts
    hearts.forEach(h => {
        drawHeartShape(h.x, h.y, h.size, '#ff1493', 10 + h.glow);

        // inner shine
        drawHeartShape(h.x, h.y, h.size * 0.6, '#ff69b4', 0);
    });

    // draw obstacles
    obstacles.forEach(o => {
        if (o.type === 'spike') {
            ctx.fillStyle = '#6a0dad';
            ctx.shadowColor = '#9b30ff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(o.x, o.y);
            ctx.lineTo(o.x + o.w / 2, o.y - o.h);
            ctx.lineTo(o.x + o.w, o.y);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // glow line
            ctx.strokeStyle = 'rgba(155,48,255,0.5)';
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = 'rgba(106,13,173,0.8)';
            ctx.shadowColor = '#9b30ff';
            ctx.shadowBlur = 8;
            ctx.fillRect(o.x, o.y, o.w, o.h);
            ctx.shadowBlur = 0;
        }
    });

    // draw particles
    particles.forEach(p => {
        const alpha = p.life / p.maxLife;
        if (p.isText) {
            ctx.font = `bold ${16 + (1 - alpha) * 8}px Arial`;
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
        } else if (p.isHeart) {
            ctx.globalAlpha = alpha;
            drawHeartShape(p.x, p.y, p.size, p.color, 0);
            ctx.globalAlpha = 1;
        } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    });

    ctx.restore();
}

// ===== Fireworks for Victory =====
let fwParticles = [];
let fwInterval = null;

function launchFirework() {
    const x = Math.random() * fwCanvas.width;
    const y = Math.random() * fwCanvas.height * 0.5 + 50;
    const hue = Math.random() * 360;
    const count = 60 + Math.floor(Math.random() * 40);

    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const vel = 2 + Math.random() * 4;
        fwParticles.push({
            x, y,
            vx: Math.cos(angle) * vel * (0.8 + Math.random() * 0.4),
            vy: Math.sin(angle) * vel * (0.8 + Math.random() * 0.4),
            life: 70 + Math.random() * 30,
            maxLife: 100,
            hue, size: 2 + Math.random() * 2,
            trail: []
        });
    }
}

function drawFireworks() {
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    fwParticles = fwParticles.filter(p => {
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 5) p.trail.shift();

        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.vx *= 0.99;
        p.life--;

        const alpha = p.life / p.maxLife;
        // trail
        p.trail.forEach((t, i) => {
            const ta = (i / p.trail.length) * alpha * 0.5;
            fwCtx.fillStyle = `hsla(${p.hue},100%,70%,${ta})`;
            fwCtx.beginPath();
            fwCtx.arc(t.x, t.y, p.size * 0.5, 0, Math.PI * 2);
            fwCtx.fill();
        });

        fwCtx.fillStyle = `hsla(${p.hue},100%,70%,${alpha})`;
        fwCtx.shadowColor = `hsla(${p.hue},100%,50%,0.8)`;
        fwCtx.shadowBlur = 6;
        fwCtx.beginPath();
        fwCtx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        fwCtx.fill();
        fwCtx.shadowBlur = 0;

        return p.life > 0;
    });
}

// ===== Flower Rain for Victory =====
function startFlowerRain() {
    const emojis = ['🌹', '🌺', '🌸', '🌼', '💐', '🌷', '💕', '💝', '💗'];
    let count = 0;
    const interval = setInterval(() => {
        if (count++ > 40 || state !== 'victory') { clearInterval(interval); return; }
        const el = document.createElement('div');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.cssText = `position:fixed;font-size:${30+Math.random()*30}px;z-index:11;
            left:${Math.random()*100}%;top:-50px;pointer-events:none;
            animation:fall ${3+Math.random()*3}s linear forwards;`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 6000);
    }, 150);
}

// add fall animation
const styleSheet = document.createElement('style');
styleSheet.textContent = `@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(${window.innerHeight+100}px) rotate(${360}deg);opacity:0.3;}}`;
document.head.appendChild(styleSheet);

// ===== State Changes =====
function startGame() {
    initGame();
    state = 'playing';
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('victoryScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    fwParticles = [];
    if (fwInterval) { clearInterval(fwInterval); fwInterval = null; }
    updateHUD();
}

function gameOver() {
    state = 'gameover';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

function victory() {
    state = 'victory';
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('victoryScreen').classList.remove('hidden');
    document.getElementById('victorySub').textContent =
        maxCombo >= 5 ? `最高连击 ${maxCombo}x ！你太厉害了！` :
        maxCombo >= 3 ? `最高连击 ${maxCombo}x ！` : '每一颗爱心都是我对你的心意';

    // fireworks
    launchFirework();
    fwInterval = setInterval(() => {
        if (state === 'victory') {
            launchFirework();
            if (Math.random() > 0.5) launchFirework();
        }
    }, 600);

    startFlowerRain();
}

// ===== Input =====
function doJump() {
    if (state !== 'playing') return;
    if (player.jumps < player.maxJumps) {
        player.vy = player.jumps === 0 ? JUMP_POWER : DOUBLE_JUMP_POWER;
        player.jumps++;
        player.grounded = false;

        emitParticles(player.x + player.w / 2, player.y + player.h, 'rgba(255,105,180,0.6)', 8, 3, 20);

        if (player.jumps === 2) {
            // double jump sparkle
            emitParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffd700', 12, 4, 25);
        }
    }
}

document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        doJump();
    }
});

canvas.addEventListener('touchstart', e => { e.preventDefault(); doJump(); }, { passive: false });
canvas.addEventListener('click', doJump);

// ===== Game Loop =====
function loop(ts) {
    update(ts);
    draw();
    if (state === 'victory') drawFireworks();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
