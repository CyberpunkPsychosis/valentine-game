<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>情人节快乐 - 莉莉！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            cursor: pointer;
        }

        #startScreen, #gameOverScreen, #victoryScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            z-index: 10;
        }

        #victoryScreen {
            background: radial-gradient(circle, rgba(255,0,150,0.3) 0%, rgba(0,0,0,0.9) 100%);
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493; }
            50% { text-shadow: 0 0 40px #ff69b4, 0 0 80px #ff1493, 0 0 120px #ff69b4; }
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 30px;
            color: #ffb6c1;
        }

        .button {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 20, 147, 0.4);
            transition: all 0.3s;
            font-weight: bold;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(255, 20, 147, 0.6);
        }

        .hidden {
            display: none !important;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
            font-weight: bold;
        }

        .heart-icon {
            display: inline-block;
            color: #ff1493;
            font-size: 30px;
            animation: heartbeat 1s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .victory-text {
            font-size: 64px;
            font-weight: bold;
            color: #ff69b4;
            text-align: center;
            line-height: 1.5;
            text-shadow: 0 0 30px #ff1493, 0 0 60px #ff69b4;
            animation: fadeInScale 2s ease-in-out;
            margin: 20px;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .flower {
            position: absolute;
            font-size: 60px;
            animation: floatUp 3s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-500px) rotate(360deg); opacity: 0; }
        }

        .instruction {
            font-size: 18px;
            color: #ffb6c1;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen">
        <div class="title">💕 莉莉的情人节冒险 💕</div>
        <div class="subtitle">收集20颗爱心，赢取惊喜！</div>
        <button class="button" onclick="startGame()">开始游戏</button>
        <div class="instruction">点击屏幕或按空格跳跃</div>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="title">💔 再试一次 💔</div>
        <div class="subtitle">不要放弃，爱需要勇气！</div>
        <button class="button" onclick="restartGame()">重新开始</button>
    </div>

    <div id="victoryScreen" class="hidden">
        <div class="victory-text">我爱你，莉莉！<br>情人节快乐！</div>
        <button class="button" onclick="restartGame()">再玩一次</button>
    </div>

    <div id="score" class="hidden">
        <span class="heart-icon">❤</span> <span id="scoreValue">0</span> / 20
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 设置画布大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 游戏状态
        let gameState = 'start'; // start, playing, gameover, victory
        let score = 0;
        const TARGET_SCORE = 20;

        // 玩家对象
        const player = {
            x: 100,
            y: canvas.height - 150,
            width: 40,
            height: 40,
            velocityY: 0,
            gravity: 0.8,
            jumpPower: -15,
            isJumping: false,
            color: '#ff1493'
        };

        // 游戏对象数组
        let hearts = [];
        let obstacles = [];
        let particles = [];
        let fireworks = [];
        let flowers = [];

        // 生成爱心
        function createHeart() {
            hearts.push({
                x: canvas.width,
                y: Math.random() * (canvas.height - 200) + 50,
                width: 30,
                height: 30,
                speed: 3
            });
        }

        // 生成障碍物
        function createObstacle() {
            obstacles.push({
                x: canvas.width,
                y: canvas.height - 100,
                width: 30,
                height: 50,
                speed: 4
            });
        }

        // 绘制爱心
        function drawHeart(x, y, size) {
            ctx.save();
            ctx.fillStyle = '#ff1493';
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(x, y + size / 4);
            ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + size / 4);
            ctx.bezierCurveTo(x - size / 2, y + size / 2, x, y + size, x, y + size * 1.2);
            ctx.bezierCurveTo(x, y + size, x + size / 2, y + size / 2, x + size / 2, y + size / 4);
            ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + size / 4);
            ctx.fill();
            ctx.restore();
        }

        // 绘制玩家
        function drawPlayer() {
            ctx.save();
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 20;
            drawHeart(player.x + player.width / 2, player.y, player.width);
            ctx.restore();
        }

        // 绘制障碍物
        function drawObstacle(obs) {
            ctx.fillStyle = '#4a148c';
            ctx.shadowColor = '#7b1fa2';
            ctx.shadowBlur = 10;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        }

        // 粒子效果
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 60,
                    color: color
                });
            }
        }

        // 烟火效果
        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height * 0.5;
            const hue = Math.random() * 360;

            for (let i = 0; i < 50; i++) {
                const angle = (Math.PI * 2 * i) / 50;
                const velocity = 2 + Math.random() * 3;
                fireworks.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * velocity,
                    vy: Math.sin(angle) * velocity,
                    life: 80,
                    hue: hue
                });
            }
        }

        // 碰撞检测
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // 跳跃
        function jump() {
            if (!player.isJumping) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
            }
        }

        // 更新游戏
        function update() {
            if (gameState !== 'playing') return;

            // 更新玩家
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // 地面碰撞
            if (player.y >= canvas.height - 150) {
                player.y = canvas.height - 150;
                player.velocityY = 0;
                player.isJumping = false;
            }

            // 更新爱心
            hearts.forEach((heart, index) => {
                heart.x -= heart.speed;

                // 碰撞检测
                if (checkCollision(player, heart)) {
                    hearts.splice(index, 1);
                    score++;
                    document.getElementById('scoreValue').textContent = score;
                    createParticles(heart.x, heart.y, '#ff69b4');

                    // 检查胜利
                    if (score >= TARGET_SCORE) {
                        victory();
                    }
                }

                // 移除屏幕外的爱心
                if (heart.x + heart.width < 0) {
                    hearts.splice(index, 1);
                }
            });

            // 更新障碍物
            obstacles.forEach((obs, index) => {
                obs.x -= obs.speed;

                // 碰撞检测
                if (checkCollision(player, obs)) {
                    gameOver();
                }

                // 移除屏幕外的障碍物
                if (obs.x + obs.width < 0) {
                    obstacles.splice(index, 1);
                }
            });

            // 更新粒子
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(index, 1);
                }
            });

            // 更新烟火
            fireworks.forEach((f, index) => {
                f.x += f.vx;
                f.y += f.vy;
                f.vy += 0.05; // 重力
                f.life--;
                if (f.life <= 0) {
                    fireworks.splice(index, 1);
                }
            });
        }

        // 绘制背景星星
        function drawStars() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 2;
                ctx.fillRect(x, y, size, size);
            }
        }

        // 绘制
        function draw() {
            // 清空画布
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(0.5, '#764ba2');
            gradient.addColorStop(1, '#f093fb');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawStars();

            if (gameState !== 'playing') return;

            // 绘制地面
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

            // 绘制玩家
            drawPlayer();

            // 绘制爱心
            hearts.forEach(heart => {
                drawHeart(heart.x + heart.width / 2, heart.y, heart.width);
            });

            // 绘制障碍物
            obstacles.forEach(obs => {
                drawObstacle(obs);
            });

            // 绘制粒子
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 60;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1;
            });

            // 绘制烟火
            fireworks.forEach(f => {
                ctx.fillStyle = `hsl(${f.hue}, 100%, 50%)`;
                ctx.globalAlpha = f.life / 80;
                ctx.beginPath();
                ctx.arc(f.x, f.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        // 游戏循环
        let lastHeartTime = 0;
        let lastObstacleTime = 0;
        let lastFireworkTime = 0;

        function gameLoop(timestamp) {
            update();
            draw();

            if (gameState === 'playing') {
                // 生成爱心
                if (timestamp - lastHeartTime > 2000) {
                    createHeart();
                    lastHeartTime = timestamp;
                }

                // 生成障碍物
                if (timestamp - lastObstacleTime > 2500) {
                    createObstacle();
                    lastObstacleTime = timestamp;
                }
            }

            if (gameState === 'victory') {
                // 持续生成烟火
                if (timestamp - lastFireworkTime > 500) {
                    createFirework();
                    lastFireworkTime = timestamp;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // 开始游戏
        function startGame() {
            gameState = 'playing';
            score = 0;
            hearts = [];
            obstacles = [];
            particles = [];
            player.y = canvas.height - 150;
            player.velocityY = 0;

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('victoryScreen').classList.add('hidden');
            document.getElementById('score').classList.remove('hidden');
            document.getElementById('scoreValue').textContent = score;
        }

        // 游戏结束
        function gameOver() {
            gameState = 'gameover';
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('score').classList.add('hidden');
        }

        // 胜利
        function victory() {
            gameState = 'victory';
            document.getElementById('victoryScreen').classList.remove('hidden');
            document.getElementById('score').classList.add('hidden');

            // 创建鲜花效果
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.className = 'flower';
                    flower.textContent = ['🌹', '🌺', '🌸', '🌼', '💐'][Math.floor(Math.random() * 5)];
                    flower.style.left = Math.random() * window.innerWidth + 'px';
                    flower.style.bottom = '0px';
                    document.body.appendChild(flower);

                    setTimeout(() => flower.remove(), 3000);
                }, i * 200);
            }
        }

        // 重新开始
        function restartGame() {
            startGame();
        }

        // 事件监听
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameState === 'playing') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', () => {
            if (gameState === 'playing') {
                jump();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'playing') {
                jump();
            }
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 150;
        });

        // 启动游戏循环
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
